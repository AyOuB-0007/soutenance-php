framework:
    # Configuration optimisée pour la production
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    
    # Cache HTTP optimisé
    http_cache:
        enabled: true
    
    # Session optimisée
    session:
        cookie_secure: auto
        cookie_samesite: lax
        handler_id: null
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
